[[redirects]]
  from = "/auth/*"
  to = "https://gnay-api.onrender.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://gnay-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://gnay-api.onrender.com/uploads/:splat"
  status = 200
  force = true

[[edge_functions]]
  function = "profile-preview"
  path = "/:slug"

[[redirects]]
  from = "/local-test"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/local-test/"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/local-test/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
